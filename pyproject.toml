[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docxx"
version = "0.1.0"
description = "Doxygen-style C/C++ comments, structured JSON documentation with a built-in documentation viewer."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "0xbad4" }]
keywords = ["doxygen", "cpp", "c++", "documentation", "documentation-generator", "static-site"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Documentation",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/0xbad4/docxx"
Repository = "https://github.com/0xbad4/docxx"
Issues = "https://github.com/0xbad4/docxx/issues"

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
docxx = "docxx.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
docxx = ["viewer/*.html", "viewer/*.css", "viewer/*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
